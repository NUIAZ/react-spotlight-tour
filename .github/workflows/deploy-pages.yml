# Publishes the demo site (dist-demo/) to GitHub Pages.
#
# Only the demo is deployed — the library itself is published to npm by hand, so
# there is deliberately no publish step here that a stray push could trigger.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the site be re-published without a code change, e.g. after enabling
  # Pages for the first time in repository settings.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time. `cancel-in-progress: false` because a half-
# finished Pages deployment that gets cancelled can leave the site in a stale
# state — better to let the older run land and be superseded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the input, and a
      # dependency drifting under CI is exactly the kind of surprise a demo
      # deploy should not be able to produce.
      - name: Install dependencies
        run: npm ci

      # The gate. A demo built from source that does not typecheck or pass its
      # tests is not worth publishing.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build demo
        run: npm run build:demo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
